<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/assets/favicon_logo.png" />
  <title>RankFlow — AI Resume Screening & Ranking</title>
  <script>
    (function () {
      try {
        var originalFetch = window.fetch;
        var fetchValue = originalFetch;
        Object.defineProperty(window, 'fetch', {
          configurable: true,
          enumerable: true,
          get: function () {
            return fetchValue;
          },
          set: function (val) {
            fetchValue = val;
          }
        });
        if (typeof globalThis !== 'undefined') {
          Object.defineProperty(globalThis, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function () {
              return fetchValue;
            },
            set: function (val) {
              fetchValue = val;
            }
          });
        }
        if (typeof self !== 'undefined') {
          Object.defineProperty(self, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function () {
              return fetchValue;
            },
            set: function (val) {
              fetchValue = val;
            }
          });
        }
      } catch (e) {
        console.warn("Failed to patch fetch property:", e);
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
